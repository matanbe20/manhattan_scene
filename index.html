<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const FONT = "'Bangers', 'Comic Sans MS', sans-serif";

// ------------------------------------------------------------------ utils
let _seed = 20261016;
const rand = () => (_seed = (_seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const rpick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const C = h => new THREE.Color(h);
const UP = new THREE.Vector3(0, 1, 0);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
function mat4(x, y, z, ry, sx, sy, sz, rz = 0) {
  _p.set(x, y, z); _e.set(0, ry, rz, 'YXZ'); _q.setFromEuler(_e); _s.set(sx, sy, sz);
  return _m.compose(_p, _q, _s);
}

// ------------------------------------------------------------------ renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfeeff, 380, 1250);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 4000);
camera.position.set(40, 520, 760);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 40);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 6;
controls.maxDistance = 1100;

const hemi = new THREE.HemisphereLight(0xdff2ff, 0xa08c6a, 1.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -230, right: 230, top: 230, bottom: -230, near: 1, far: 900 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.25;
scene.add(sun, sun.target);
const SUN_DAY = new THREE.Vector3(-150, 260, 130), SUN_NIGHT = new THREE.Vector3(140, 240, -90);

// ------------------------------------------------------------------ toon materials
const gradTex = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter;
gradTex.generateMipmaps = false;
gradTex.needsUpdate = true;
const toon = (color, o = {}) => new THREE.MeshToonMaterial({ color, gradientMap: gradTex, ...o });
const INK = 0x1b1530;
const OUT_MAT = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
const U = { uNight: { value: 0 }, uTime: { value: 0 } };

// Building material: toon shading + procedural windows that light up at night.
// style 0 = plain, 1 = punched windows, 2 = glass curtain wall, 3 = big square grid
function buildingMat(color, style = 1, extra = {}) {
  const m = toon(color, extra);
  const styleU = { value: style };
  m.onBeforeCompile = sh => {
    sh.uniforms.uNight = U.uNight;
    sh.uniforms.uStyle = styleU;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; varying vec3 vWNorm; flat varying vec2 vSeed;`)
      .replace('#include <fog_vertex>', `#include <fog_vertex>
        {
          mat4 bm = modelMatrix;
          #ifdef USE_INSTANCING
            bm = modelMatrix * instanceMatrix;
          #endif
          vec4 bw = bm * vec4(transformed, 1.0);
          vWPos = bw.xyz; vWNorm = normalize(mat3(bm) * objectNormal); vSeed = bm[3].xz;
        }`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uNight; uniform float uStyle;
        varying vec3 vWPos; varying vec3 vWNorm; flat varying vec2 vSeed;
        float bHash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float bWin = 0.0; float bLit = 0.0;
        {
          vec3 n = normalize(vWNorm);
          vec2 sd = mod(floor(vSeed * 2.0 + 0.5), 97.0);
          if (n.y > 0.6) { diffuseColor.rgb *= 0.8; }
          else if (uStyle > 0.5 && abs(n.y) < 0.45) {
            float h = bHash(sd * 0.37 + 0.5);
            float floorH = uStyle > 2.5 ? 0.75 : 1.05 + h * 0.45;
            float colW = uStyle > 2.5 ? 0.75 : (uStyle > 1.5 ? 1.5 : 0.85 + fract(h * 7.13) * 0.7);
            float u = abs(n.x) > abs(n.z) ? vWPos.z : vWPos.x;
            vec2 cell = vec2(u / colW, (vWPos.y - 0.25) / floorH);
            vec2 f = fract(cell);
            float wx = uStyle > 2.5 ? 0.14 : (uStyle > 1.5 ? 0.04 : 0.2 + fract(h * 3.7) * 0.12);
            float wy = uStyle > 2.5 ? 0.14 : (uStyle > 1.5 ? 0.16 : 0.26);
            float inW = step(wx, f.x) * step(f.x, 1.0 - wx) * step(wy, f.y) * step(f.y, 0.88);
            float above = step(1.0, cell.y);
            float fw = max(fwidth(cell.x), fwidth(cell.y));
            float aa = clamp((0.42 - fw) / 0.2, 0.0, 1.0);
            bWin = above * mix(0.45, inW, aa);
            float r = bHash(mod(floor(cell), 113.0) + sd);
            bLit = mix(0.55, step(0.45, r), aa);
            vec3 glass = mix(vec3(0.20, 0.30, 0.52), vec3(0.62, 0.84, 1.0), step(0.7, bHash(mod(floor(cell), 113.0) * 1.7 + sd.yx)) * aa);
            if (uStyle > 1.5 && uStyle < 2.5) glass = mix(glass, diffuseColor.rgb * 0.9, 0.35);
            glass = mix(glass, vec3(0.06, 0.07, 0.14), uNight);
            diffuseColor.rgb = mix(diffuseColor.rgb, glass, bWin);
          }
        }`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += bWin * bLit * uNight * vec3(1.0, 0.8, 0.42) * 1.25;`);
  };
  m.customProgramCacheKey = () => 'bld';
  return m;
}

// Water: toon blue with drifting comic wave strokes
const waterMat = toon(0x2e8fe3);
waterMat.onBeforeCompile = sh => {
  sh.uniforms.uTime = U.uTime; sh.uniforms.uNight = U.uNight;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
    .replace('#include <fog_vertex>', '#include <fog_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uNight; varying vec3 vWP;')
    .replace('#include <color_fragment>', `#include <color_fragment>
      {
        vec2 p = vWP.xz;
        float w1 = sin(p.x * 0.07 + uTime * 0.5 + sin(p.y * 0.045) * 2.5);
        float w2 = sin(p.y * 0.09 - uTime * 0.35 + sin(p.x * 0.06) * 2.0);
        float band = step(0.55, w1 * w2 + 0.25 * sin((p.x + p.y) * 0.025 + uTime * 0.2));
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 1.3 + 0.04, band * 0.55);
        float row = floor(p.y / 7.0);
        float dir = mod(row, 2.0) * 2.0 - 1.0;
        float lx = p.x + sin(p.y * 0.25 + uTime) * 1.2 + row * 13.7 + uTime * 0.8 * dir;
        float rowF = fract(p.y / 7.0);
        float dash = step(0.86, fract(lx / 16.0)) * step(abs(rowF - 0.5), 0.045);
        dash *= clamp(1.0 - fwidth(p.y / 7.0) * 9.0, 0.0, 1.0);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(1.0), dash * 0.85 * (1.0 - 0.65 * uNight));
      }`);
};
waterMat.customProgramCacheKey = () => 'water';

// ------------------------------------------------------------------ mesh helpers
const boxG = (w, h, d) => new THREE.BoxGeometry(w, h, d).translate(0, h / 2, 0);
const cylG = (rt, rb, h, s = 16) => new THREE.CylinderGeometry(rt, rb, h, s).translate(0, h / 2, 0);
const _bb = new THREE.Vector3(), _bc = new THREE.Vector3();
function ink(mesh, t = 0.15) {
  const g = mesh.geometry;
  if (!g.boundingBox) g.computeBoundingBox();
  g.boundingBox.getSize(_bb); g.boundingBox.getCenter(_bc);
  const sc = v => v > 0.02 ? (v + 2 * t) / v : 1;
  const o = new THREE.Mesh(g, OUT_MAT);
  o.scale.set(sc(_bb.x), sc(_bb.y), sc(_bb.z));
  o.position.set(_bc.x * (1 - o.scale.x), _bc.y * (1 - o.scale.y), _bc.z * (1 - o.scale.z));
  mesh.add(o);
  return mesh;
}

  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  m.castShadow = o.cast !== false;
  m.receiveShadow = true;
  if (o.ink !== 0) ink(m, o.ink ?? 0.15);
  parent.add(m);
  return m;
}
function colorize(geo, hex) {
  const c = C(hex), n = geo.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return geo;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function segLines(pts, color) {
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color }));
}

// ------------------------------------------------------------------ geography
const MAN = [[-2,214],[-18,205],[-30,190],[-38,170],[-44,140],[-48,100],[-50,60],[-50,20],[-49,-20],[-47,-60],[-45,-100],
  [-42,-140],[-38,-175],[-32,-205],[-22,-228],[-10,-238],[4,-236],[16,-222],[24,-200],[32,-170],[40,-130],[46,-100],
  [48,-60],[50,-20],[52,20],[54,60],[57,100],[61,120],[57,140],[47,158],[35,178],[22,196],[10,208]];
const EAST = [[-60,-800],[-60,-330],[-40,-262],[-15,-255],[20,-250],[45,-236],[66,-215],[76,-190],[80,-150],[84,-60],[92,0],
  [96,80],[100,140],[96,180],[102,230],[125,300],[150,420],[800,420],[800,-800]];
const NJ = [[-800,-800],[-80,-800],[-80,-330],[-88,-200],[-92,-100],[-95,0],[-96,100],[-100,180],[-122,230],[-165,290],[-220,420],[-800,420]];
const circlePoly = (cx, cz, r, n = 20) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * Math.PI * 2) * r, cz + Math.sin(i / n * Math.PI * 2) * r * 0.75]);
const GOV = circlePoly(24, 252, 9);

function pip(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
function segDist(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}
function shoreDist(x, z, poly) {
  let m = Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) m = Math.min(m, segDist(x, z, poly[j][0], poly[j][1], poly[i][0], poly[i][1]));
  return m;
}
const inLand = (x, z, poly, m = 0) => pip(x, z, poly) && (m <= 0 || shoreDist(x, z, poly) >= m);
function clipHalf(poly, f) { // keep the part of a convex polygon where f(p) >= 0
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], fa = f(a), fb = f(b);
    if (fa >= 0) out.push(a);
    if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  return out;
}
const clipZ = (poly, zc) => clipHalf(poly, p => p[1] - zc);
function polyArea(p) {
  let s = 0;
  for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; }
  return s / 2;
}
function offsetConvex(poly, t) { // grow a convex polygon outward by t (mitred, clamped)
  const sgn = polyArea(poly) > 0 ? 1 : -1, n = poly.length;

    const n1 = nrm(poly[(i - 1 + n) % n], p), n2 = nrm(p, poly[(i + 1) % n]);
    const k = Math.min(t / Math.max(1 + n1[0] * n2[0] + n1[1] * n2[1], 0.15), 3 * t);
    return [p[0] + (n1[0] + n2[0]) * k, p[1] + (n1[1] + n2[1]) * k];

}
const toShape = poly => new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x, -z)));
function landMesh(poly, top, side, depth = 6) {
  const geo = new THREE.ExtrudeGeometry(toShape(poly), { depth, bevelEnabled: false, curveSegments: 1 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, -depth, 0);
  const m = new THREE.Mesh(geo, [toon(top), toon(side)]);
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function flatPoly(poly, color, y) {
  const geo = new THREE.ShapeGeometry(toShape(poly)); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, toon(color)); m.position.y = y; m.receiveShadow = true; scene.add(m);
  return m;
}
const prismGeo = (poly, y, h) => { const g = new THREE.ExtrudeGeometry(toShape(poly), { depth: h, bevelEnabled: false }); g.rotateX(-Math.PI / 2); g.translate(0, y, 0); return g; };

const water = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000).rotateX(-Math.PI / 2), waterMat);
water.position.y = -0.8; water.receiveShadow = true; scene.add(water);
landMesh(MAN, 0xe4dccb, 0x8f8270);
landMesh(EAST, 0xe6dcc4, 0x8f8270);
landMesh(NJ, 0xe6dcc4, 0x8f8270);
landMesh(GOV, 0x8fd46c, 0x8f8270);
flatPoly(clipZ(MAN, 199), 0x7fcb57, 0.02); // Battery Park

// ------------------------------------------------------------------ Broadway: the diagonal that breaks the grid
// north -> south: Upper West Side, Columbus Circle, Times Square, Herald Sq, Madison Sq (Flatiron), Union Sq, Lower Broadway
const BW = [[-30.5, -180], [-30.5, -26], [-21, 0], [-14, 32], [-7, 62], [7, 81], [17, 97.5], [17, 117], [12, 130], [3, 150], [-3, 178], [-6, 202]];
const BW_HALF = 1.8;
function bwX(z) {
  for (let i = 1; i < BW.length; i++) if (z <= BW[i][1]) { const a = BW[i - 1], b = BW[i]; return lerp(a[0], b[0], (z - a[1]) / (b[1] - a[1])); }
  return BW[BW.length - 1][0];
}
function cutPolyline(pts, z0, z1) { // pts monotonic in z
  const out = [];
  const at = z => { for (let i = 1; i < pts.length; i++) if (z <= pts[i][1]) { const a = pts[i - 1], b = pts[i]; return [lerp(a[0], b[0], (z - a[1]) / (b[1] - a[1])), z]; } };
  if (z0 > pts[0][1]) out.push(at(z0));
  for (const p of pts) if (p[1] >= z0 && p[1] <= z1) out.push(p);
  if (z1 < pts[pts.length - 1][1]) out.push(at(z1));

        const bt = bubbleCache.get(txt);
        b.s.material.map = bt.tex; b.s.material.needsUpdate = true; b.asp = bt.asp;
        b.ent = e; b.age = 0; b.life = 2.6; b.s.visible = true;
        break;
      }
    }
  }
  for (const b of bubbles) {
    if (!b.ent) continue;
    b.age += dt;
    if (b.age > b.life) { b.ent = null; b.s.visible = false; continue; }
    const e = b.ent, k = Math.min(1, b.age * 5), pop = 1 + 2.7 * (k - 1) ** 3 + 1.7 * (k - 1) ** 2;
    b.s.position.set(e.px, e.py + e.hh, e.pz);
    b.s.scale.set(0.04 * b.asp * pop, 0.04 * pop, 1);
    b.s.material.opacity = Math.min(1, (b.life - b.age) / 0.4);
  }
}
// Times Square screens flip to new ads
const flipping = [];
let flipTimer = 0;
function updateScreens(dt) {
  flipTimer -= dt;
  if (flipTimer <= 0 && screens.length) { flipTimer = 0.25; const s = rpick(screens); if (!s.flip) { s.flip = 0.0001; flipping.push(s); } }
  for (let i = flipping.length - 1; i >= 0; i--) {
    const s = flipping[i], before = s.flip;
    s.flip += dt * 3;
    if (before < 0.5 && s.flip >= 0.5) s.m.material = rpick(adMats);
    s.m.scale.y = s.sy * Math.abs(1 - 2 * Math.min(s.flip, 1));
    if (s.flip >= 1) { s.flip = 0; s.m.scale.y = s.sy; flipping.splice(i, 1); }
  }
}

// ------------------------------------------------------------------ camera fly / tour / UI
let fly = null, tour = false, tourIdx = 0, tourNext = 0;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
function landmarkView(L) {
  if (L.view) return L.view();
  const d = L.dist, el = L.el ?? 0.9, hz = Math.cos(el) * d, tx = L.tx ?? L.x, tz = L.tz ?? L.z;
  return { pos: new THREE.Vector3(tx + Math.sin(L.ang) * hz, L.look + Math.sin(el) * d, tz + Math.cos(L.ang) * hz), tgt: new THREE.Vector3(tx, L.look, tz) };
}
function flyTo(pos, tgt, dur = 2.6) {
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, start: performance.now() / 1000, dur };
}
const placesEl = document.getElementById('places');
const placeBtns = LANDMARKS.map((L, i) => {
  const b = document.createElement('button'); b.textContent = L.n;
  b.onclick = () => { setTour(false); goLandmark(i); };
  placesEl.appendChild(b); return b;
});
function goLandmark(i) {
  const v = landmarkView(LANDMARKS[i]); flyTo(v.pos, v.tgt);
  placeBtns.forEach((b, k) => b.classList.toggle('on', k === i));
}
const btnTour = document.getElementById('btnTour');
function setTour(on) { tour = on; btnTour.classList.toggle('on', on); btnTour.textContent = on ? '■ Stop tour' : '▶ Tour'; tourNext = 0; if (!on) controls.autoRotate = false; }
btnTour.onclick = () => setTour(!tour);
const btnNight = document.getElementById('btnNight');
btnNight.onclick = () => { nightTarget = nightTarget ? 0 : 1; btnNight.textContent = nightTarget ? '☀️ Day' : '🌙 Night'; btnNight.classList.toggle('on', !!nightTarget); };
const btnLabels = document.getElementById('btnLabels');
btnLabels.onclick = () => { const on = !btnLabels.classList.contains('on'); btnLabels.classList.toggle('on', on); labelSprites.forEach(s => s.visible = on); };
controls.addEventListener('start', () => { fly = null; if (tour) setTour(false); placeBtns.forEach(b => b.classList.remove('on')); });

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5 || !btnLabels.classList.contains('on')) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(labelSprites)[0];
  if (hit) { setTour(false); goLandmark(LANDMARKS.indexOf(hit.object.userData.L)); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', e => { if (e.key === 'n') btnNight.click(); if (e.key === 'l') btnLabels.click(); if (e.key === 't') btnTour.click(); });

flyTo(new THREE.Vector3(185, 150, 270), new THREE.Vector3(0, 8, 30), 4.5); // intro fly-in

// ------------------------------------------------------------------ main loop
const clock = new THREE.Clock();
let first = true;
renderer.setAnimationLoop(() => {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05), t = clock.elapsedTime, now = performance.now() / 1000;
  U.uTime.value = t;
  night += clamp(nightTarget - night, -rawDt * 0.6, rawDt * 0.6);
  applyNight(night, t);

  updateCars(dt, t);
  updatePeople(dt);
  updateMascots(dt);
  updateTrains(dt);
  updateBoats(dt, t);
  updateBubbles(dt);
  updateScreens(dt);

  heli.rotor.rotation.y += dt * 30;
  const ha = t * 0.25;
  heli.g.position.set(-40 + Math.cos(ha) * 48, 50 + Math.sin(t * 0.7) * 3, 225 + Math.sin(ha) * 40);
  heli.g.rotation.set(0.12, -ha - Math.PI, -0.18);
  const ba = t * 0.03;
  blimp.position.set(Math.cos(ba) * 130, 105, 30 + Math.sin(ba) * 170);
  blimp.rotation.y = Math.atan2(-Math.sin(ba) * 130, Math.cos(ba) * 170);
  const fc = [-7 + Math.sin(t * 0.21) * 9, 26 + Math.sin(t * 0.5) * 4, -55 + Math.cos(t * 0.13) * 45];
  for (const b of birds) {
    const a = t * 0.9 + b.ph;
    b.g.position.set(fc[0] + b.ox + Math.cos(a) * 3, fc[1] + b.oy + Math.sin(a * 1.3), fc[2] + b.oz + Math.sin(a) * 3);
    b.g.rotation.y = Math.atan2(Math.cos(t * 0.13) * 0.1, -Math.sin(t * 0.13)) + Math.sin(a) * 0.3;
    const fl = Math.sin(t * 14 + b.ph) * 0.7; b.l.rotation.z = fl; b.r.rotation.z = -fl;
  }
  for (const c of clouds) { c.position.x += dt * 2.2; if (c.position.x > 520) c.position.x = -520; }
  for (const f of dyn.flames) f.scale.set(1 + Math.sin(t * 13) * 0.1, 1 + Math.sin(t * 17) * 0.15, 1 + Math.cos(t * 11) * 0.1);
  dyn.jets.forEach((j, i) => j.scale.set(1, 0.85 + Math.sin(t * 6 + i) * 0.15, 1));
  dyn.ball.color.setHSL((t * 0.15) % 1, 0.6, 0.75);
  dyn.ticker.offset.x = (t * 0.06) % 1;

  if (tour && !fly && now > tourNext) { goLandmark(tourIdx++ % LANDMARKS.length); tourNext = now + 2.6 + 7; }
  controls.autoRotate = tour && !fly; controls.autoRotateSpeed = 1.2;
  if (fly) {
    const k = ease(clamp((now - fly.start) / fly.dur, 0, 1));
    camera.position.lerpVectors(fly.p0, fly.p1, k);
    controls.target.lerpVectors(fly.t0, fly.t1, k);
    if (k >= 1) fly = null;
  }
  controls.update();
  sky.position.copy(camera.position);

  const tx = Math.round(controls.target.x / 2) * 2, tz = Math.round(controls.target.z / 2) * 2;
  sun.target.position.set(tx, 0, tz);
  sun.position.set(tx + sunOff.x, sunOff.y, tz + sunOff.z);

  renderer.render(scene, camera);
  if (first) { first = false; const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 800); }
});
</script>
